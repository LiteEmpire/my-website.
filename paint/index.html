<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lite Paint — Drawing Studio</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#20283b;--muted:#738096;--accent:#4263eb;--line:#e2e7f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,Segoe UI,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 11px;transition:.15s}button:hover{border-color:#a8b6dc;background:#f7f8ff}button.active{background:#e9edff;border-color:#8ea0ff;color:#2849d8}button:disabled{opacity:.4;cursor:not-allowed}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;white-space:nowrap}.logo{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#4263eb,#9b6bff);color:white;font-size:20px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#304fc8;color:white}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{background:var(--panel);border-right:1px solid var(--line);padding:17px;display:flex;flex-direction:column;gap:19px}.section-title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase;margin:0 0 10px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tool{padding:10px 3px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;min-height:62px;font-size:11px}.tool .ico{font-size:20px;line-height:1}.field{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;color:#536078;font-size:12px}.field input[type=range]{width:105px;accent-color:var(--accent)}.field input[type=color]{width:35px;height:30px;border:0;padding:0;background:none;cursor:pointer}.field select{width:112px;padding:6px;border:1px solid var(--line);border-radius:7px;background:#fff}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.swatch{width:25px;height:25px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d9dfeb}.swatch.selected{box-shadow:0 0 0 2px var(--accent)}.workspace{padding:22px;min-width:0;display:flex;flex-direction:column;gap:13px}.canvasbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.canvasbar strong{font-size:15px}.canvasbar span{color:var(--muted);font-size:12px}.canvas-wrap{flex:1;min-height:360px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px;background:#e8ecf4;border:1px solid #dce2ed;border-radius:15px;box-shadow:inset 0 1px 3px #d4dae5}.paper{position:relative;box-shadow:0 5px 22px #1c2b4718;line-height:0;max-width:100%;touch-action:none;background:white}canvas{display:block;max-width:100%;height:auto;touch-action:none;cursor:crosshair}.status{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;flex-wrap:wrap}.hint{padding:11px 12px;border-radius:9px;background:#f5f7ff;color:#61708d;font-size:12px}.divider{height:1px;background:var(--line)}#fileInput{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.top{padding:10px 12px;height:auto;align-items:flex-start}.brand{font-size:16px}.top-actions button{padding:7px}.layout aside{border-right:0;border-bottom:1px solid var(--line);padding:13px}.tools{grid-template-columns:repeat(6,1fr)}.tool{min-height:52px}.tool .ico{font-size:18px}.workspace{padding:12px}.canvas-wrap{min-height:300px;padding:8px}.field input[type=range]{width:100px}}@media(max-width:420px){.tools{grid-template-columns:repeat(4,1fr)}.top{flex-direction:column}.top-actions{justify-content:flex-start}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">✎</div><span>Lite Paint</span></div><div class="top-actions"><button id="newBtn">＋ New</button><button id="openBtn">↥ Open</button><button id="undoBtn" title="Undo (Ctrl+Z)" disabled>↶ Undo</button><button id="redoBtn" title="Redo (Ctrl+Y)" disabled>↷ Redo</button><button id="saveBtn" class="primary">↓ Save PNG</button></div></header>
<div class="layout"><aside>
<section><h2 class="section-title">Tools</h2><div class="tools" id="tools">
<button class="tool active" data-tool="pencil"><span class="ico">✎</span>Pencil</button><button class="tool" data-tool="brush"><span class="ico">🖌</span>Brush</button><button class="tool" data-tool="eraser"><span class="ico">▱</span>Eraser</button>
<button class="tool" data-tool="line"><span class="ico">╱</span>Line</button><button class="tool" data-tool="rect"><span class="ico">▱</span>Rectangle</button><button class="tool" data-tool="ellipse"><span class="ico">◯</span>Ellipse</button>
<button class="tool" data-tool="fill"><span class="ico">🪣</span>Fill</button><button class="tool" data-tool="text"><span class="ico">T</span>Text</button><button class="tool" data-tool="eyedropper"><span class="ico">◉</span>Picker</button>
</div></section>
<section><h2 class="section-title">Brush settings</h2><div class="field"><label for="size">Size</label><span><input id="size" type="range" min="1" max="60" value="5"> <b id="sizeVal">5</b></span></div><div class="field"><label for="opacity">Opacity</label><span><input id="opacity" type="range" min="10" max="100" value="100"> <b id="opacityVal">100%</b></span></div><div class="field"><label for="shapeStyle">Shape style</label><select id="shapeStyle"><option value="stroke">Outline</option><option value="fill">Filled</option></select></div><div class="field"><label for="textSize">Text size</label><select id="textSize"><option>16</option><option selected>28</option><option>40</option><option>56</option><option>72</option></select></div></section>
<section><h2 class="section-title">Colours</h2><div class="field"><label for="color">Primary colour</label><input id="color" type="color" value="#20283b"></div><div class="palette" id="palette"></div><div class="field"><label for="bgColor">Canvas background</label><input id="bgColor" type="color" value="#ffffff"></div><button id="backgroundBtn" style="width:100%">Apply background</button></section>
<div class="divider"></div><section><h2 class="section-title">Canvas</h2><div class="field"><label for="canvasSize">Canvas size</label><select id="canvasSize"><option value="800x600">800 × 600</option><option value="1024x768">1024 × 768</option><option value="1280x720">1280 × 720</option><option value="600x600">600 × 600</option></select></div><button id="resizeBtn" style="width:100%">Resize canvas</button><button id="clearBtn" style="width:100%;margin-top:7px">Clear canvas</button></section>
<div class="hint">Tip: use Ctrl+Z to undo and Ctrl+Y to redo. Save your artwork as a PNG image.</div>
</aside><main class="workspace"><div class="canvasbar"><div><strong>Your canvas</strong><br><span>Make something wonderful.</span></div><span id="dimensionLabel">800 × 600 px</span></div><div class="canvas-wrap"><div class="paper"><canvas id="canvas" width="800" height="600" aria-label="Drawing canvas"></canvas></div></div><div class="status"><span id="statusText">Pencil selected · Ready to draw</span><span>Lite Paint · Your work stays in your browser</span></div></main></div>
<input type="file" id="fileInput" accept="image/*">
<script>
(()=>{const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});const $=id=>document.getElementById(id);let tool='pencil',drawing=false,start=null,snapshot=null,history=[],future=[],bg='#ffffff';const palette=['#20283b','#ffffff','#000000','#e03131','#f76707','#f59f00','#82c91e','#2f9e44','#0ca678','#1098ad','#1971c2','#4263eb','#7048e8','#ae3ec9','#e64980','#868e96','#795548','#ffc9c9'];function paintBg(color){ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='destination-over';ctx.fillStyle=color;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore()}function initial(){ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);history=[];future=[];syncHistory();saveState()}function saveState(){if(history.length>30)history.shift();history.push(ctx.getImageData(0,0,canvas.width,canvas.height));future=[];syncHistory()}function syncHistory(){$('undoBtn').disabled=history.length<2;$('redoBtn').disabled=!future.length}function undo(){if(history.length<2)return;future.push(history.pop());ctx.putImageData(history[history.length-1],0,0);syncHistory()}function redo(){if(!future.length)return;const s=future.pop();history.push(s);ctx.putImageData(s,0,0);syncHistory()}function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function settings(){ctx.lineWidth=+$('size').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=$('color').value;ctx.fillStyle=$('color').value;ctx.globalAlpha=+$('opacity').value/100;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'}function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function shape(a,b,preview=false){ctx.beginPath();if(tool==='line'){line(a,b);return}if(tool==='rect'){const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);$('shapeStyle').value==='fill'?ctx.fillRect(x,y,w,h):ctx.strokeRect(x,y,w,h)}if(tool==='ellipse'){ctx.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,Math.PI*2);$('shapeStyle').value==='fill'?ctx.fill():ctx.stroke()}}canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=pos(e);if(tool==='fill'){const img=ctx.getImageData(0,0,canvas.width,canvas.height),d=img.data,x=Math.floor(p.x),y=Math.floor(p.y),i=(y*canvas.width+x)*4;const target=[d[i],d[i+1],d[i+2],d[i+3]],hex=$('color').value,rgba=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),Math.round(255*(+$('opacity').value/100))];if(target.every((v,k)=>v===rgba[k]))return;const stack=[[x,y]],seen=new Uint8Array(canvas.width*canvas.height);let count=0;while(stack.length&&count<canvas.width*canvas.height){const [cx,cy]=stack.pop();if(cx<0||cy<0||cx>=canvas.width||cy>=canvas.height)continue;const pi=cy*canvas.width+cx;if(seen[pi])continue;seen[pi]=1;const j=pi*4;if(Math.abs(d[j]-target[0])+Math.abs(d[j+1]-target[1])+Math.abs(d[j+2]-target[2])+Math.abs(d[j+3]-target[3])>35)continue;d[j]=rgba[0];d[j+1]=rgba[1];d[j+2]=rgba[2];d[j+3]=255;stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);count++}ctx.putImageData(img,0,0);saveState();return}if(tool==='eyedropper'){const px=ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;$('color').value='#'+[px[0],px[1],px[2]].map(v=>v.toString(16).padStart(2,'0')).join('');setTool('pencil');return}if(tool==='text'){const text=prompt('Enter your text:');if(text){saveState();ctx.save();settings();ctx.globalCompositeOperation='source-over';ctx.font='600 '+$('textSize').value+'px Segoe UI, sans-serif';ctx.textBaseline='top';ctx.fillText(text,p.x,p.y);ctx.restore();saveState()}return}drawing=true;start=p;snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);canvas.setPointerCapture(e.pointerId);settings();if(['pencil','brush','eraser'].includes(tool)){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineWidth=tool==='brush'?+$('size').value*2:+$('size').value;ctx.strokeStyle=$('color').value;ctx.globalAlpha=+$('opacity').value/100;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'}});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);settings();if(['pencil','brush','eraser'].includes(tool)){ctx.lineTo(p.x,p.y);ctx.lineWidth=tool==='brush'?+$('size').value*2:+$('size').value;ctx.stroke();return}ctx.putImageData(snapshot,0,0);settings();shape(start,p,true)});function finish(){if(!drawing)return;drawing=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';saveState();$('statusText').textContent='Drawing saved to history · '+tool}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('pointerleave',()=>{});function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));canvas.style.cursor=t==='text'?'text':t==='eyedropper'?'copy':'crosshair';$('statusText').textContent=t.charAt(0).toUpperCase()+t.slice(1)+' selected · Ready to draw'}document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));$('size').addEventListener('input',e=>$('sizeVal').textContent=e.target.value);$('opacity').addEventListener('input',e=>$('opacityVal').textContent=e.target.value+'%');$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});$('saveBtn').onclick=()=>{const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');o.fillStyle=bg;o.fillRect(0,0,out.width,out.height);o.drawImage(canvas,0,0);const a=document.createElement('a');a.download='lite-paint-artwork.png';a.href=out.toDataURL('image/png');a.click()};$('openBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);bg='#ffffff';$('bgColor').value=bg;updateDims();history=[];future=[];saveState();e.target.value=''};im.onerror=()=>alert('Could not open that image.');im.src=URL.createObjectURL(f)};$('newBtn').onclick=()=>{if(confirm('Start a new blank canvas? Your current artwork will be replaced unless you saved it.'))initial()};$('clearBtn').onclick=()=>{if(confirm('Clear the entire canvas?')){ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);saveState()}};$('backgroundBtn').onclick=()=>{bg=$('bgColor').value;const old=ctx.getImageData(0,0,canvas.width,canvas.height);ctx.globalCompositeOperation='destination-over';ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalCompositeOperation='source-over';saveState()};function updateDims(){$('dimensionLabel').textContent=canvas.width+' × '+canvas.height+' px'}$('resizeBtn').onclick=()=>{const [w,h]=$('canvasSize').value.split('x').map(Number);if(!confirm('Resize canvas? Current artwork will be cleared.'))return;canvas.width=w;canvas.height=h;updateDims();initial()};palette.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===$('color').value?' selected':'');b.style.background=c;b.title=c;b.onclick=()=>{$('color').value=c;document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected',s===b))};$('palette').appendChild(b)});$('color').addEventListener('input',()=>document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected')));initial();})();
</script>
</body></html>
